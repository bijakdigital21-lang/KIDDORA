<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiddora - Belajar ABC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 800px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 601px) {
            .container {
                border-radius: 30px;
                height: 90vh;
            }
        }

        /* Skrin Pemilihan Bahasa */
        #language-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            padding: 20px;
            text-align: center;
        }

        .logo-title {
            font-size: 3.5rem;
            color: #ff4757;
            text-shadow: 3px 3px 0px #ffa502;
            margin-bottom: 10px;
        }

        .logo-subtitle {
            font-size: 1.5rem;
            color: #2f3542;
            margin-bottom: 40px;
        }

        .lang-btn-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .lang-btn {
            flex: 1;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .lang-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }

        .btn-bm { background-color: #2ed573; }
        .btn-bi { background-color: #1e90ff; }

        /* Skrin Utama Modul ABC */
        #abc-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #fffdf9;
        }

        .app-header {
            background-color: #ffa502;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .back-btn {
            background: #ff4757;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b33939;
        }

        .back-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b33939;
        }

        .card-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .letter-card {
            background: white;
            width: 100%;
            max-width: 350px;
            height: 440px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            border: 5px solid #70a1ff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .letter-card:hover {
            transform: scale(1.02);
        }

        .big-letter {
            font-size: 5.5rem;
            font-weight: bold;
            color: #ff4757;
            line-height: 1;
            text-shadow: 3px 3px 0px #ffeaa7;
        }

        .card-image-container {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f2f6;
            border-radius: 20px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 3px solid #dfe4ea;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .word-label {
            font-size: 2rem;
            color: #2f3542;
            font-weight: bold;
            text-transform: capitalize;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: #f8f9fa;
            gap: 15px;
        }

        .nav-btn {
            flex: 1;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background-color: #3742fa;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #2f3640;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2f3640;
        }

        .sound-hint {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #747d8c;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SKRIN 1: PILIH BAHASA -->
        <div id="language-screen">
            <h1 class="logo-title">Kiddora</h1>
            <p class="logo-subtitle">Pilih Bahasa / Choose Language</p>
            <div class="lang-btn-container">
                <button class="lang-btn btn-bm" onclick="setLanguage('ms')">Bahasa Melayu</button>
                <button class="lang-btn btn-bi" onclick="setLanguage('en')">English</button>
            </div>
        </div>

        <!-- SKRIN 2: MODUL ABC -->
        <div id="abc-screen">
            <div class="app-header">
                <div class="header-title" id="module-title">Belajar ABC</div>
                <button class="back-btn" onclick="goBack()">🏠 Menu</button>
            </div>

            <div class="card-area">
                <div class="letter-card" onclick="speakCurrentCard()">
                    <div class="big-letter" id="display-letter">A</div>
                    <div class="card-image-container">
                        <img id="display-img" src="" alt="Gambar Pembelajaran">
                    </div>
                    <div class="word-label" id="display-word">Epal</div>
                </div>
                <div class="sound-hint">🔊 Sentuh kad untuk dengar bunyi</div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn" onclick="prevLetter()">⬅️ Sebelumnya</button>
                <button class="nav-btn" onclick="nextLetter()">Seterusnya ➡️</button>
            </div>
        </div>
    </div>

    <script>
        // Data Huruf Versi Bahasa Melayu (BM) & English (EN) dengan pautan gambar sebenar
        const alphabetData = {
            ms: [
                { letter: 'A', word: 'Epal', img: 'https://cdn-icons-png.flaticon.com/512/415/415733.png' },
                { letter: 'B', word: 'Bola', img: 'https://cdn-icons-png.flaticon.com/512/33/33736.png' },
                { letter: 'C', word: 'Cawan', img: 'https://cdn-icons-png.flaticon.com/512/924/924514.png' },
                { letter: 'D', word: 'Duri', img: 'https://cdn-icons-png.flaticon.com/512/3014/3014467.png' },
                { letter: 'E', word: 'Ekor', img: 'https://cdn-icons-png.flaticon.com/512/616/616408.png' },
                { letter: 'F', word: 'Feri', img: 'https://cdn-icons-png.flaticon.com/512/2933/2933116.png' },
                { letter: 'G', word: 'Gajah', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069186.png' },
                { letter: 'H', word: 'Harimau', img: 'https://cdn-icons-png.flaticon.com/512/616/616554.png' },
                { letter: 'I', word: 'Ikan', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069172.png' },
                { letter: 'J', word: 'Jarum', img: 'https://cdn-icons-png.flaticon.com/512/3233/3233480.png' },
                { letter: 'K', word: 'Kucing', img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' },
                { letter: 'L', word: 'Lalat', img: 'https://cdn-icons-png.flaticon.com/512/2272/2272808.png' },
                { letter: 'M', word: 'Madu', img: 'https://cdn-icons-png.flaticon.com/512/3592/3592233.png' },
                { letter: 'N', word: 'Nenas', img: 'https://cdn-icons-png.flaticon.com/512/2909/2909787.png' },
                { letter: 'O', word: 'Oren', img: 'https://cdn-icons-png.flaticon.com/512/1728/1728751.png' },
                { letter: 'P', word: 'Paku', img: 'https://cdn-icons-png.flaticon.com/512/2202/2202271.png' },
                { letter: 'Q', word: 'Quran', img: 'https://cdn-icons-png.flaticon.com/512/2436/2436856.png' },
                { letter: 'R', word: 'Rusa', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069201.png' },
                { letter: 'S', word: 'Susu', img: 'https://cdn-icons-png.flaticon.com/512/2674/2674136.png' },
                { letter: 'T', word: 'Topi', img: 'https://cdn-icons-png.flaticon.com/512/2584/2584606.png' },
                { letter: 'U', word: 'Ular', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069195.png' },
                { letter: 'V', word: 'Van', img: 'https://cdn-icons-png.flaticon.com/512/741/741407.png' },
                { letter: 'W', word: 'Wau', img: 'https://cdn-icons-png.flaticon.com/512/2549/2549903.png' },
                { letter: 'X', word: 'Xifos', img: 'https://cdn-icons-png.flaticon.com/512/3358/3358049.png' },
                { letter: 'Y', word: 'Yoyo', img: 'https://cdn-icons-png.flaticon.com/512/2592/2592770.png' },
                { letter: 'Z', word: 'Zirafah', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069189.png' }
            ],
            en: [
                { letter: 'A', word: 'Apple', img: 'https://cdn-icons-png.flaticon.com/512/415/415733.png' },
                { letter: 'B', word: 'Ball', img: 'https://cdn-icons-png.flaticon.com/512/33/33736.png' },
                { letter: 'C', word: 'Cat', img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' },
                { letter: 'D', word: 'Dog', img: 'https://cdn-icons-png.flaticon.com/512/616/616408.png' },
                { letter: 'E', word: 'Elephant', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069186.png' },
                { letter: 'F', word: 'Fish', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069172.png' },
                { letter: 'G', word: 'Grapes', img: 'https://cdn-icons-png.flaticon.com/512/763/763784.png' },
                { letter: 'H', word: 'Hat', img: 'https://cdn-icons-png.flaticon.com/512/2584/2584606.png' },
                { letter: 'I', word: 'Ice Cream', img: 'https://cdn-icons-png.flaticon.com/512/938/938067.png' },
                { letter: 'J', word: 'Jug', img: 'https://cdn-icons-png.flaticon.com/512/924/924514.png' },
                { letter: 'K', word: 'Kite', img: 'https://cdn-icons-png.flaticon.com/512/2549/2549903.png' },
                { letter: 'L', word: 'Lion', img: 'https://cdn-icons-png.flaticon.com/512/616/616554.png' },
                { letter: 'M', word: 'Monkey', img: 'https://cdn-icons-png.flaticon.com/512/616/616567.png' },
                { letter: 'N', word: 'Nest', img: 'https://cdn-icons-png.flaticon.com/512/3048/3048386.png' },
                { letter: 'O', word: 'Orange', img: 'https://cdn-icons-png.flaticon.com/512/1728/1728751.png' },
                { letter: 'P', word: 'Pen', img: 'https://cdn-icons-png.flaticon.com/512/1250/1250689.png' },
                { letter: 'Q', word: 'Queen', img: 'https://cdn-icons-png.flaticon.com/512/2355/2355444.png' },
                { letter: 'R', word: 'Rabbit', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069201.png' },
                { letter: 'S', word: 'Sun', img: 'https://cdn-icons-png.flaticon.com/512/869/869869.png' },
                { letter: 'T', word: 'Tree', img: 'https://cdn-icons-png.flaticon.com/512/2933/2933157.png' },
                { letter: 'U', word: 'Umbrella', img: 'https://cdn-icons-png.flaticon.com/512/1069/1069794.png' },
                { letter: 'V', word: 'Van', img: 'https://cdn-icons-png.flaticon.com/512/741/741407.png' },
                { letter: 'W', word: 'Watch', img: 'https://cdn-icons-png.flaticon.com/512/2921/2921222.png' },
                { letter: 'X', word: 'Xylophone', img: 'https://cdn-icons-png.flaticon.com/512/2748/2748577.png' },
                { letter: 'Y', word: 'Yacht', img: 'https://cdn-icons-png.flaticon.com/512/2933/2933116.png' },
                { letter: 'Z', word: 'Zebra', img: 'https://cdn-icons-png.flaticon.com/512/3069/3069189.png' }
            ]
        };

        let currentLang = 'ms';
        let currentIndex = 0;

        function setLanguage(lang) {
            currentLang = lang;
            currentIndex = 0;
            document.getElementById('language-screen').style.display = 'none';
            document.getElementById('abc-screen').style.display = 'flex';
            
            document.getElementById('module-title').innerText = (lang === 'ms') ? 'Kenal ABC (BM)' : 'Learn ABC (EN)';
            updateCard();
            speakCurrentCard();
        }

        function goBack() {
            document.getElementById('abc-screen').style.display = 'none';
            document.getElementById('language-screen').style.display = 'flex';
        }

        function updateCard() {
            const data = alphabetData[currentLang][currentIndex];
            document.getElementById('display-letter').innerText = data.letter;
            document.getElementById('display-img').src = data.img;
            document.getElementById('display-word').innerText = data.word;
        }

        function nextLetter() {
            const max = alphabetData[currentLang].length;
            currentIndex = (currentIndex + 1) % max;
            updateCard();
            speakCurrentCard();
        }

        function prevLetter() {
            const max = alphabetData[currentLang].length;
            currentIndex = (currentIndex - 1 + max) % max;
            updateCard();
            speakCurrentCard();
        }

        function speakCurrentCard() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const data = alphabetData[currentLang][currentIndex];
                const textToSpeak = `${data.letter}, ${data.word}`;
                
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = (currentLang === 'ms') ? 'ms-MY' : 'en-US';
                utterance.rate = 0.8; 
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
