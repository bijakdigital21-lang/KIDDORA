<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiddora - Dunia Pembelajaran Ceria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', cursive, sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-image: url('https://i.imgur.com/vB28UDe.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
        }

        /* Header */
        .header {
            text-align: center;
            margin-top: 10px;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px rgba(0,0,0,0.1);
            animation: bounce 2s infinite;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #2b2b2b;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            padding: 20px 0;
        }

        .menu-card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 0px rgba(0,0,0,0.15);
            transition: all 0.1s ease;
            border: 4px solid #fff;
        }

        .menu-card:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.15);
        }

        .menu-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .menu-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #444;
        }

        /* Warna unik untuk setiap kad */
        .card-1 { background-color: #ff9999; }
        .card-2 { background-color: #99ccff; }
        .card-3 { background-color: #ffff99; }
        .card-4 { background-color: #99ff99; }

        /* Modal / Content Area */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            display: none;
            z-index: 10;
        }

        .screen.active {
            display: flex;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff5e5e;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0px #b33636;
        }

        .back-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .interactive-display {
            font-size: 5rem;
            margin: 20px 0;
            background: #fff;
            padding: 30px 50px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            border: 4px dashed #ff9999;
        }

        .action-btn {
            background: #4cd137;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0px #26ae60;
            margin-top: 10px;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #26ae60;
        }

        /* Animasi */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .mascot {
            font-size: 4rem;
            animation: bounce 1.5s infinite ease-in-out;
            margin-bottom: -10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="mascot">🐶</div>
            <div class="logo">KIDDORA</div>
            <div class="subtitle">Jom Belajar Sambil Bermain! 🎉</div>
        </div>

        <div class="menu-grid">
            <div class="menu-card card-1" onclick="openScreen('abcScreen')">
                <div class="menu-icon">🔤</div>
                <div class="menu-title">ABC & 123</div>
            </div>
            <div class="menu-card card-2" onclick="openScreen('animalScreen')">
                <div class="menu-icon">🐱</div>
                <div class="menu-title">Bunyi Haiwan</div>
            </div>
            <div class="menu-card card-3" onclick="openScreen('colorScreen')">
                <div class="menu-icon">🎨</div>
                <div class="menu-title">Warna-Warni</div>
            </div>
            <div class="menu-card card-4" onclick="openScreen('gameScreen')">
                <div class="menu-icon">⭐</div>
                <div class="menu-title">Teka Bintang</div>
            </div>
        </div>

        <div style="font-size: 0.9rem; color: #333; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 10px;">
            Versi 1.0 • Khas untuk Anak Comel 💖
        </div>

        <div id="abcScreen" class="screen">
            <button class="back-btn" onclick="closeScreen('abcScreen')">⬅️ Balik</button>
            <h2>Belajar Huruf & Nombor</h2>
            <div class="interactive-display" id="abcDisplay">A</div>
            <button class="action-btn" onclick="nextAbc()">Tekan Seterusnya! 👆</button>
        </div>

        <div id="animalScreen" class="screen">
            <button class="back-btn" onclick="closeScreen('animalScreen')">⬅️ Balik</button>
            <h2>Suara Haiwan Comel</h2>
            <div class="interactive-display" id="animalDisplay">🐱 Meow!</div>
            <button class="action-btn" onclick="nextAnimal()">Tukar Haiwan! 🐾</button>
        </div>

        <div id="colorScreen" class="screen">
            <button class="back-btn" onclick="closeScreen('colorScreen')">⬅️ Balik</button>
            <h2>Pilih Warna Kegemaran</h2>
            <div class="interactive-display" id="colorDisplay" style="background-color: #ff9999; color: white;">Merah Jambu</div>
            <button class="action-btn" onclick="nextColor()">Tukar Warna! 🎨</button>
        </div>

        <div id="gameScreen" class="screen">
            <button class="back-btn" onclick="closeScreen('gameScreen')">⬅️ Balik</button>
            <h2>Permainan Bintang</h2>
            <div class="interactive-display" id="gameDisplay">⭐</div>
            <p id="gameText" style="font-size: 1.3rem; margin-top: 10px; font-weight: bold;">Tekan bintang untuk dapat mata!</p>
            <button class="action-btn" onclick="playGame()">Dapat Bintang! ✨</button>
        </div>
    </div>

        // Fungsi Kawalan Skrin
        function openScreen(screenId) {
            document.getElementById(screenId).classList.add('active');
        }

        function closeScreen(screenId) {
            document.getElementById(screenId).classList.remove('active');
        }

        let abcIndex = 0;

            abcIndex = (abcIndex + 1) % abcList.length;
            document.getElementById('abcDisplay').innerText = abcList[abcIndex];
        }

            { emoji: "🐮", name: "Moo! (Lembu)" },
            { emoji: "🐸", name: "Ribbit! (Katak)" },
            { emoji: "🦁", name: "Roar! (Singa)" }
        ];
        let animalIndex = 0;
        function nextAnimal() {
            animalIndex = (animalIndex + 1) % animalList.length;
            document.getElementById('animalDisplay').innerText = `${animalList[animalIndex].emoji} ${animalList[animalIndex].name}`;
        }

        // Data Warna
        const colorList = [
            { name: "Merah Jambu", hex: "#ff9999" },
            { name: "Biru Langit", hex: "#99ccff" },
            { name: "Kuning Ceria", hex: "#ffff99" },
            { name: "Hijau Daun", hex: "#99ff99" },
            { name: "Oren Ceria", hex: "#ffb366" }
        ];
        let colorIndex = 0;
        function nextColor() {
            colorIndex = (colorIndex + 1) % colorList.length;
            let current = colorList[colorIndex];
            let display = document.getElementById('colorDisplay');
            display.style.backgroundColor = current.hex;
            display.innerText = current.name;
        }
